<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang="Z070标题">Z-070 · Roachy · Цη¡νerse ∀erse</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 1.8em;
            color: #f0f6fc;
            margin: 0;
        }
        .back-btn {
            color: #58a6ff;
            text-decoration: none;
            border: 1px solid #30363d;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9em;
            transition: 0.2s;
        }
        .back-btn:hover {
            background-color: #161b22;
            border-color: #58a6ff;
        }
        .archive-box {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 8px;
            padding: 20px 25px;
        }
        .table-grid {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 8px 20px;
            padding: 10px 0;
        }
        .table-item { border-bottom: 1px solid #21262d; padding: 8px 0; }
        .label { color: #8b949e; font-weight: bold; }
        .footer {
            margin-top: 50px;
            font-size: 0.8em;
            color: #8b949e;
            text-align: center;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const translations = {
                "Z070标题": "Z-070 · Roachy · Цη¡νerse ∀erse",
                "返回Z序列": "Back to Z-Sequence",
                "全名": "Full Name",
                "编号": "ID",
                "种族/物种": "Species",
                "年龄": "Age",
                "出身/诞生地": "Origin",
                "性别": "Gender",
                "未记录": "Unrecorded",
                "次元宇宙档案馆": "Universe Verse Archive",
                
                /* 新增的详细翻译 */
                "疑似蟑螂（最强生物形态）": "Suspected Cockroach (Strongest Biological Form)",
                "未知": "Unknown",
                "未知（据说进过 F 宇宙）": "Unknown (Reportedly entered Universe F)"
            };
            const toggleBtn = document.getElementById("lang-toggle");
            const elements = document.querySelectorAll("[data-lang]");
            let currentLang = "zh";
            function toggleLanguage() {
                currentLang = (currentLang === "zh") ? "en" : "zh";
                elements.forEach(el => {
                    const key = el.getAttribute("data-lang");
                    if (currentLang === "en" && translations[key]) {
                        el.textContent = translations[key];
                    } else {
                        el.textContent = el.getAttribute("data-original");
                    }
                });
                if(toggleBtn) toggleBtn.textContent = (currentLang === "zh") ? "🌍 English" : "🌏 中文";
            }
            elements.forEach(el => el.setAttribute("data-original", el.textContent));
            if(toggleBtn) toggleBtn.addEventListener("click", toggleLanguage);
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1 data-lang="Z070标题">🪳 Z-070 · Roachy</h1>
            <button id="lang-toggle" style="background: transparent; border: 1px solid #58a6ff; color: #58a6ff; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8em;">🌍 English</button>
            <a href="z-series.html" class="back-btn" data-lang="返回Z序列">← 返回Z序列</a>
        </div>

        <div class="archive-box">
            <div class="table-grid">
                <div class="table-item label" data-lang="全名">全名</div>
                <div class="table-item">Roachy（Roach + y）</div>
                <div class="table-item label" data-lang="编号">编号</div>
                <div class="table-item">Z-070</div>
                <div class="table-item label" data-lang="种族/物种">种族/物种</div>
                <div class="table-item" data-lang="疑似蟑螂（最强生物形态）">疑似蟑螂（最强生物形态）</div>
                <div class="table-item label" data-lang="年龄">年龄</div>
                <div class="table-item" data-lang="未知">未知</div>
                <div class="table-item label" data-lang="出身/诞生地">出身/诞生地</div>
                <div class="table-item" data-lang="未知（据说进过 F 宇宙）">未知（据说进过 F 宇宙）</div>
                <div class="table-item label" data-lang="性别">性别</div>
                <div class="table-item" data-lang="未记录">未记录</div>
            </div>
        </div>

        <div class="footer" data-lang="次元宇宙档案馆">Цη¡νerse ∀erse · 次元宇宙档案馆</div>
    </div>
</body>
</html>
